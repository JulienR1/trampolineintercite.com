name: CI

on:
  push:
  pull_request:

jobs:
  common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci
      - run: npm run build

  web:
    needs: common
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install common library
        working-directory: ./packages/common
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- run
      - run: npm run build -- --mode test

